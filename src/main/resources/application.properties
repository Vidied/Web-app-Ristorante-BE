# I valori sensibili/configurabili vivono in .env (non versionato).
# Copia .env.example in .env e adatta i valori.
spring.config.import=optional:file:./.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Configurazione JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Ristorante
restaurant.cover-price=${RESTAURANT_COVER_PRICE:2.00}

# CORS (lista separata da virgole, es. http://localhost,http://localhost:80,http://192.168.1.15)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80}

# Stampanti
printer.pizzeria.port=${PRINTER_PIZZERIA_PORT}
printer.pizzeria.name-hint=${PRINTER_PIZZERIA_NAME_HINT}
printer.pizzeria.mac=${PRINTER_PIZZERIA_MAC:}
printer.pizzeria.max-retries=${PRINTER_PIZZERIA_MAX_RETRIES:3}
printer.pizzeria.retry-delay-ms=${PRINTER_PIZZERIA_RETRY_DELAY_MS:1500}

printer.cucina.port=${PRINTER_CUCINA_PORT}
printer.cucina.name-hint=${PRINTER_CUCINA_NAME_HINT}
printer.cucina.mac=${PRINTER_CUCINA_MAC:}
printer.cucina.max-retries=${PRINTER_CUCINA_MAX_RETRIES:3}
printer.cucina.retry-delay-ms=${PRINTER_CUCINA_RETRY_DELAY_MS:1500}

printer.sala.name=${PRINTER_SALA_NAME}
printer.sala.max-retries=${PRINTER_SALA_MAX_RETRIES:3}
printer.sala.retry-delay-ms=${PRINTER_SALA_RETRY_DELAY_MS:1500}

printer.receipt.name=${PRINTER_RECEIPT_NAME}
printer.receipt.max-retries=${PRINTER_RECEIPT_MAX_RETRIES:3}
printer.receipt.retry-delay-ms=${PRINTER_RECEIPT_RETRY_DELAY_MS:1500}

printer.health-check-interval-ms=${PRINTER_HEALTH_CHECK_INTERVAL_MS:180000}

# Versione backend (app.git-commit valorizzato a build time dalla pipeline)
app.version=@project.version@
app.build-time=@maven.build.timestamp@
app.git-commit=@app.git-commit@
