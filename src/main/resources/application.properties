# Valori di prova per avvio immediato (nessun file .env richiesto); da cambiare in un contesto reale.
spring.datasource.url=jdbc:postgresql://localhost:5432/capstone
spring.datasource.username=postgres
spring.datasource.password=YOUR_DB_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configurazione JWT
jwt.secret=CHANGE_ME_WITH_YOUR_OWN_JWT_SECRET_KEY_AT_LEAST_32_CHARS_LONG
jwt.expiration=86400000

restaurant.cover-price=2.00

# Stampanti (porte/valori di esempio)
printer.pizzeria.port=COM3
printer.pizzeria.name-hint=PRINTER_PIZZERIA

printer.cucina.port=COM5
printer.cucina.name-hint=PRINTER_CUCINA

printer.sala.name=PRINTER_SALA
printer.sala.max-retries=3
printer.sala.retry-delay-ms=1500

printer.receipt.name=PRINTER_SALA
printer.receipt.max-retries=3
printer.receipt.retry-delay-ms=1500

printer.health-check-interval-ms=180000